  </defs>
  <rect width="1200" height="630" fill="url(#og-bg)"/>
  <circle cx="200" cy="150" r="260" fill="#8b6bff" fill-opacity="0.18" filter="blur(80px)"/>
  <circle cx="1000" cy="520" r="280" fill="#22d3ee" fill-opacity="0.14" filter="blur(80px)"/>
