      <stop offset="0" stop-color="#0b0e16"/>
      <stop offset="1" stop-color="#151b2e"/>
    </linearGradient>
    <linearGradient id="og-grad" x1="0" y1="0" x2="1200" y2="630" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#8b6bff"/>
