      <stop offset="0" stop-color="#7c5cff"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
  </defs>
  <!-- 圆角方形脑袋 -->
  <rect x="4" y="6" width="32" height="28" rx="13" fill="url(#wbskin-logo)"/>
  <!-- 左耳 -->
  <circle cx="11" cy="10" r="5.5" fill="url(#wbskin-logo)"/>
  <!-- 右耳 -->
  <circle cx="29" cy="10" r="5.5" fill="url(#wbskin-logo)"/>
  <!-- 脸部 -->
  <rect x="8" y="12" width="24" height="18" rx="10" fill="#fff" fill-opacity="0.92"/>
  <!-- 左眼 -->
  <ellipse cx="15.5" cy="20" rx="2.6" ry="3.4" fill="#0b0e16"/>
  <!-- 右眼 -->
  <ellipse cx="24.5" cy="20" rx="2.6" ry="3.4" fill="#0b0e16"/>
  <!-- 微笑 -->
